<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Credencial Digital</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="credencial">
      <header class="encabezado">
        <div class="header-top">
          <span class="texto-terminal">&gt; whoami</span>
          <div class="header-comments">
            <span>// BUILD</span>
            <span>// LEARN</span>
            <span>// PLAY</span>
            <span>// REPEAT</span>
          </div>
        </div>
        <h1>JUAN ESTEBAN PERDOMO</h1>
        <p>Desarrollador Fullstack Jr</p>
      </header>

      <div class="cuerpo-tarjeta">
        <img
          class="fotoPerfil"
          src="foto.jpeg"
          alt="Foto de Juan Esteban Perdomo Hernandez"
        />

        <div class="bloque-informacion">
          <div class="info-item">
            <i class="fa-solid fa-location-dot"></i>
            <div class="info-contenido">
              <span class="label">Ciudad</span>
              <span class="value">Bogotá, Colombia</span>
            </div>
          </div>

          <div class="info-item">
            <i class="fa-solid fa-envelope"></i>
            <div class="info-contenido">
              <span class="label">Correo</span>
              <span class="value">juanperdomo@mi_correo.com</span>
            </div>
          </div>

          <div class="info-item">
            <i class="fa-solid fa-gamepad"></i>
            <div class="info-contenido">
              <span class="label">Hobby</span>
              <span class="value">Videojuegos</span>
            </div>
          </div>

          <div class="iconos-inferiores">
            <div class="info-item icono-solo">
              <i class="fa-solid fa-code"></i>
              <div class="info-contenido">
                <span class="label">Tecnología</span>
                <span class="value">JavaScript</span>
              </div>
            </div>

            <a
              href="https://github.com/JEPH204"
              target="_blank"
              class="info-item icono-solo github-btn"
            >
              <i class="fa-brands fa-github"></i>
              <div class="info-contenido">
                <span class="label">GitHub</span>
                <span class="value">github.com/JEPH204</span>
              </div>
            </a>
          </div>
        </div>
      </div>

      <footer id="pie">
        <span class="git-commit">$ git commit -m "Ideas en código, realidades en progreso"</span>
      </footer>
    </div>
  </body>
</html>
